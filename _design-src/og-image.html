<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10xCart social share image (1200x630)</title>
<!-- Rendered to assets/img/brand/og-image.jpg by render_screens.py -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600&amp;family=Rubik:wght@600;700&amp;display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{padding:24px;background:#64748b}
.og{position:relative;width:1200px;height:630px;overflow:hidden;background:linear-gradient(135deg,#0d2140 0%,#102a55 52%,#09348e 100%);color:#fff;font-family:Rubik,sans-serif}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 70% 80% at 30% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 70% 80% at 30% 40%,#000 30%,transparent 80%)}
.g1{position:absolute;right:-120px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(229,93,25,.42),transparent)}
.g2{position:absolute;left:-200px;bottom:-260px;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(5,90,187,.5),transparent)}
.copy{position:absolute;left:68px;top:64px;width:540px}
.logo{display:block;height:66px;width:auto}
h1{margin-top:38px;font:700 56px/1.05 Rubik,sans-serif;letter-spacing:-.025em}
h1 span{display:block;background:linear-gradient(92deg,#ff7a2e,#faa011);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:20px;width:500px;color:#c9dbf7;font:500 22px/1.45 'Nunito Sans',sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;list-style:none}
.chips li{padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font:600 17px 'Nunito Sans',sans-serif}
.chips li b{color:#faa011}
.visual{position:absolute;top:118px;right:-70px;width:620px}
.browser{overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 40px 80px -24px rgba(0,0,0,.6);transform:perspective(1600px) rotateY(-14deg) rotateX(3deg);transform-origin:left center}
.bar{display:flex;gap:6px;padding:10px 12px;background:#f1f5f9}
.bar i{width:10px;height:10px;border-radius:50%;background:#f87171}.bar i:nth-child(2){background:#fbbf24}.bar i:nth-child(3){background:#34d399}
.browser img{display:block;width:100%}
.phone{position:absolute;left:14px;top:186px;width:172px;padding:7px;border-radius:30px;background:#0a0b0f;box-shadow:0 0 0 1px #2c2f36,0 0 0 3px #a7adb7,0 30px 60px -16px rgba(0,0,0,.6)}
.phone img{display:block;width:100%;border-radius:24px}
</style>
</head>
<body>
<section class="og" id="og-image">
  <div class="grid"></div><div class="g1"></div><div class="g2"></div>
  <div class="copy">
    <img class="logo" src="../assets/img/brand/logo-horizontal-light.png" alt="10xCart">
    <h1>Ecommerce websites &amp; apps <span>for small businesses</span></h1>
    <p>Single &amp; multi-vendor stores on web, Android &amp; iOS — built and fully managed for you.</p>
    <ul class="chips"><li>Web · Android · iOS</li><li>Payments built in</li><li><b>Free demo</b></li></ul>
  </div>
  <div class="visual">
    <div class="browser"><div class="bar"><i></i><i></i><i></i></div><img src="../media/10xcart/admin-dashboard.webp" alt=""></div>
    <div class="phone"><img src="../media/10xcart/screen-fashion.webp" alt=""></div>
  </div>
</section>
</body>
</html>
